<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17243a"><title>Thời khóa biểu học sinh</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#17243a;--muted:#667085;--line:#e4e8ef;--accent:#2857c5;--danger:#b42318;--ok:#067647}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:9px 13px}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button.danger{color:var(--danger)}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:1200px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}.brand h1{font-size:clamp(22px,3vw,30px);margin:0}.brand p{color:var(--muted);margin:3px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{font-size:12px;color:var(--muted);padding:6px 9px;border:1px solid var(--line);border-radius:99px;background:#fff}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #16213b08}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}.toolbar h2{margin:0;font-size:20px}.tabs{display:flex;gap:6px}.tabs button.active{background:#e9efff;color:#173e9a;border-color:#cbd8ff}.week{display:grid;grid-template-columns:68px repeat(7,minmax(100px,1fr));overflow:auto}.dayhead{padding:10px 6px;text-align:center;border-bottom:1px solid var(--line);font-weight:700;font-size:13px;position:sticky;top:0;background:#fff}.timehead{border-bottom:1px solid var(--line)}.dayhead.today{background:#edf3ff;color:#214eb4}.slot{min-height:55px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:3px;position:relative}.slot.time{font-size:11px;color:var(--muted);text-align:right;padding:5px 7px 0 0;border-right:0}.event{border-radius:8px;padding:6px 7px;margin:2px 0;font-size:12px;overflow-wrap:anywhere;border-left:3px solid #5279d8;background:#e8efff;min-height:45px}.event b{display:block;font-size:12px}.event small{display:block;color:#3c4a65;margin-top:2px}.event button{padding:2px 5px;font-size:11px;margin-top:4px}.daylist{display:grid;gap:9px}.dayitem{display:grid;grid-template-columns:105px 1fr;gap:12px}.daytime{color:var(--muted);font-size:13px;padding-top:10px}.daycard{border-radius:10px;padding:11px 13px;background:#e8efff;border-left:4px solid #5279d8}.daycard b{display:block}.daycard .meta{font-size:12px;color:#3c4a65;margin-top:4px}.empty{padding:28px;text-align:center;color:var(--muted)}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:#0b1220a8;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}.modal{background:#fff;border-radius:16px;width:min(540px,100%);max-height:92vh;overflow:auto;padding:20px}.modal h2{margin:0 0 15px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd3df;border-radius:9px;padding:10px;background:#fff;color:var(--ink)}.field textarea{min-height:75px;resize:vertical}.modalfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:16px}.modalfoot .right{display:flex;gap:8px}.hint{font-size:12px;color:var(--muted)}.loginrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.loginrow strong{font-size:13px}.notice{padding:10px 12px;border-radius:10px;background:#fff4d6;color:#714b00;font-size:13px;margin:12px 0}.notice.ok{background:#e8f7ef;color:#05603a}.notice.err{background:#fff0ef;color:#912018}.footer{font-size:12px;color:var(--muted);text-align:center;padding:10px}.viewselect{padding:8px;border:1px solid var(--line);border-radius:9px;background:white}@media(max-width:700px){.app{padding:10px}.panel{padding:11px}.week{grid-template-columns:48px repeat(7,minmax(95px,1fr))}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.dayitem{grid-template-columns:80px 1fr}.actions button{padding:8px 10px}}
</style></head>
<body><main class="app">
<header class="top"><div class="brand"><h1>📚 Thời khóa biểu</h1><p>Lịch học dùng chung · đồng bộ qua GitHub</p></div><div class="actions"><span id="syncStatus" class="status">Đang khởi tạo…</span><button id="syncBtn">↻ Đồng bộ</button><button id="loginBtn" class="primary">Đăng nhập sửa lịch</button></div></header>
<section class="panel"><div class="toolbar"><div><h2 id="rangeTitle">Lịch tuần</h2><div id="userLine" class="hint">Chế độ xem</div></div><div class="actions"><button id="prevBtn">← Trước</button><button id="todayBtn">Hôm nay</button><button id="nextBtn">Sau →</button><select id="viewMode" class="viewselect" aria-label="Kiểu xem"><option value="week">Tuần</option><option value="day">Ngày</option><option value="list">Danh sách</option></select><select id="studentFilter" class="viewselect" aria-label="Lọc hồ sơ"><option value="all">Tất cả học sinh</option></select><button id="addBtn" class="primary hidden">＋ Thêm lịch</button></div></div></section>
<section id="calendarPanel" class="panel"><div id="calendar"></div></section>
<section class="panel"><div class="toolbar"><div><b>Đồng bộ dữ liệu</b><div class="hint">Tự kiểm tra dữ liệu mới mỗi 60 giây.</div></div><div class="actions"><label class="hint"><input id="autoSync" type="checkbox" checked> Tự động</label><button id="saveBtn" class="primary hidden">Lưu & đồng bộ lên GitHub</button><button id="tokenBtn" class="hidden">Cấu hình token GitHub</button></div></div><div id="message" class="hint" style="margin-top:10px">Dữ liệu mẫu sẽ được tải từ timetable.json.</div></section>
<div class="footer">Lưu ý: GitHub Pages có thể mất vài phút để xuất bản phiên bản JSON mới sau khi commit.</div>
</main><div id="modalRoot"></div>
<script>
/* ================== CẤU HÌNH NGƯỜI DÙNG ==================
   Đây là đăng nhập giao diện, KHÔNG phải cơ chế bảo mật thực sự.
   Hãy thay username/password mẫu trước khi sử dụng.
*/
const FIXED_USERS = [
  { username: 'admin', password: 'tinhteo123', label: 'Quản trị lịch', canEdit: true },
  { username: 'giasu', password: 'pass123', label: 'Gia sư', canEdit: true },
  { username: 'buu', password: 'pass123', label: 'Bửu', canEdit: true }
];
/* Thay các giá trị sau bằng repository của bạn. */
const GITHUB = { owner: 'YOUR_GITHUB_USERNAME', repo: 'YOUR_PRIVATE_REPO', branch: 'main', path: 'timetable.json' };
const POLL_MS = 60000;
const $ = id => document.getElementById(id);
const state = { data: null, baseRevision: 0, viewDate: new Date(), view: 'week', user: null, dirty: false, saving: false, token: sessionStorage.getItem('timetable_github_token') || '', lastPublished: null };
const DAY_NAMES = ['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const pad = n => String(n).padStart(2,'0');
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d,12); };
const startOfWeek = d => { const x = new Date(d.getFullYear(),d.getMonth(),d.getDate(),12); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
const fmtDate = d => `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const setStatus = (text, cls='') => { $('syncStatus').textContent = text; $('syncStatus').style.color = cls==='err' ? '#b42318' : cls==='ok' ? '#067647' : ''; };
function defaultData(){ return { schemaVersion:1, revision:1, updatedAt:new Date().toISOString(), updatedBy:'system', students:[{id:'student1',name:'Học sinh 1',color:'#dceafe'},{id:'student2',name:'Học sinh 2',color:'#dff5e7'}], events:[
{id:'demo1',studentId:'student1',title:'Toán',date:dateKey(new Date()),start:'07:00',end:'07:45',location:'Trường',notes:'',color:'#dceafe'},
{id:'demo2',studentId:'student1',title:'Ngữ văn',date:dateKey(new Date()),start:'08:00',end:'08:45',location:'Trường',notes:'',color:'#dff5e7'},
{id:'demo3',studentId:'student2',title:'Tiếng Anh',date:dateKey(new Date()),start:'17:30',end:'19:00',location:'Trung tâm',notes:'Mang sách bài tập',color:'#fbe8ce'}]}; }
function normalizeData(d){ if(!d || !Array.isArray(d.events) || !Array.isArray(d.students)) throw new Error('File timetable.json không đúng cấu trúc.'); d.schemaVersion ||= 1; d.revision ||= 1; return d; }
function configReady(){ return GITHUB.owner !== 'YOUR_GITHUB_USERNAME' && GITHUB.repo !== 'YOUR_PRIVATE_REPO'; }
function dataUrl(){ return `timetable.json?ts=${Date.now()}`; }
async function loadPublished({quiet=false}={}){
  if(state.dirty && !quiet){ showMessage('Bạn có thay đổi chưa lưu. Hãy lưu trước khi tải dữ liệu mới để tránh mất thay đổi.','err'); return; }
  try {
    const response = await fetch(dataUrl(), {cache:'no-store'});
    if(!response.ok) throw new Error(`Không tải được timetable.json (HTTP ${response.status}).`);
    const data = normalizeData(await response.json());
    const oldRevision = state.data?.revision;
    state.data = data; state.baseRevision = Number(data.revision)||1; state.lastPublished = data.updatedAt || null;
    render();
    if(oldRevision !== data.revision) showMessage(`Đã tải dữ liệu mới nhất · phiên bản ${data.revision} · ${data.updatedAt ? new Date(data.updatedAt).toLocaleString('vi-VN') : ''}`, 'ok');
    setStatus('Đã đồng bộ', 'ok');
  } catch(err) {
    if(!state.data) { state.data = defaultData(); render(); }
    setStatus('Lỗi tải dữ liệu','err'); showMessage(`${err.message} Đang hiển thị dữ liệu dự phòng nếu có.`, 'err');
  }
}
function showMessage(text,kind=''){ $('message').textContent=text; $('message').className = 'hint' + (kind ? ' notice '+kind : ''); }
function canEdit(){ return !!state.user?.canEdit; }
function refreshControls(){ $('loginBtn').textContent = state.user ? `Đăng xuất (${state.user.username})` : 'Đăng nhập sửa lịch'; $('addBtn').classList.toggle('hidden',!canEdit()); $('saveBtn').classList.toggle('hidden',!canEdit()); $('tokenBtn').classList.toggle('hidden',!canEdit()); $('userLine').textContent = state.user ? `Đã đăng nhập: ${state.user.label} · có quyền chỉnh sửa` : 'Chế độ xem · đăng nhập để chỉnh sửa'; }
function renderStudentFilter(){ const sel=$('studentFilter'), current=sel.value; sel.innerHTML='<option value="all">Tất cả học sinh</option>'+state.data.students.map(s=>`<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`).join(''); if([...sel.options].some(o=>o.value===current)) sel.value=current; }
function filteredEvents(){ const sid=$('studentFilter').value; return state.data.events.filter(e=>sid==='all'||e.studentId===sid).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)); }
function render(){ if(!state.data)return; refreshControls(); renderStudentFilter(); $('viewMode').value=state.view; const events=filteredEvents(); if(state.view==='week') renderWeek(events); else if(state.view==='day') renderDay(events); else renderList(events); }
function eventCard(e,compact=false){ const s=state.data.students.find(x=>x.id===e.studentId); return `<article class="event" style="background:${escapeHtml(e.color||s?.color||'#e8efff')};border-left-color:${escapeHtml(e.color||'#5279d8')}"><b>${escapeHtml(e.title)}</b><small>${escapeHtml(e.start)}–${escapeHtml(e.end)}${e.location?' · '+escapeHtml(e.location):''}</small><small>${escapeHtml(s?.name||'Học sinh')}</small>${e.notes?`<small>${escapeHtml(e.notes)}</small>`:''}${canEdit()?`<button data-edit="${escapeHtml(e.id)}">Sửa</button> <button class="danger" data-delete="${escapeHtml(e.id)}">Xóa</button>`:''}</article>`; }
function renderWeek(events){ const monday=startOfWeek(state.viewDate), days=Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(d.getDate()+i);return d;}); $('rangeTitle').textContent=`Tuần ${fmtDate(days[0])} – ${fmtDate(days[6])}`; const hours=Array.from({length:20},(_,i)=>i+5); let html='<div class="week"><div class="dayhead timehead">Giờ</div>'+days.map(d=>`<div class="dayhead ${dateKey(d)===dateKey(new Date())?'today':''}">${DAY_NAMES[d.getDay()]}<br>${pad(d.getDate())}/${pad(d.getMonth()+1)}</div>`).join(''); for(const h of hours){html+=`<div class="slot time">${pad(h)}:00</div>`; for(const d of days){const ds=dateKey(d); const ev=events.filter(e=>e.date===ds && Number(e.start.split(':')[0])===h); html+=`<div class="slot">${ev.map(e=>eventCard(e,true)).join('')}</div>`;}} html+='</div>'; $('calendar').innerHTML=html; bindEventActions(); }
function renderDay(events){const d=state.viewDate, ds=dateKey(d), list=events.filter(e=>e.date===ds); $('rangeTitle').textContent=`${DAY_NAMES[d.getDay()]}, ${fmtDate(d)}`; $('calendar').innerHTML=list.length?`<div class="daylist">${list.map(e=>`<div class="dayitem"><div class="daytime">${escapeHtml(e.start)}–${escapeHtml(e.end)}</div><div>${eventCard(e)}</div></div>`).join('')}</div>`:'<div class="empty">Không có lịch học trong ngày này.</div>'; bindEventActions(); }
function renderList(events){const monday=startOfWeek(state.viewDate), end=new Date(monday);end.setDate(end.getDate()+7); const list=events.filter(e=>parseDate(e.date)>=monday&&parseDate(e.date)<end); $('rangeTitle').textContent=`Danh sách · ${fmtDate(monday)} – ${fmtDate(new Date(end-86400000))}`; $('calendar').innerHTML=list.length?`<div class="daylist">${list.map(e=>`<div class="dayitem"><div class="daytime">${fmtDate(parseDate(e.date))}<br>${escapeHtml(e.start)}–${escapeHtml(e.end)}</div><div>${eventCard(e)}</div></div>`).join('')}</div>`:'<div class="empty">Chưa có lịch trong tuần này.</div>'; bindEventActions(); }
function bindEventActions(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEventForm(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteEvent(b.dataset.delete));}
function openModal(content){$('modalRoot').innerHTML=`<div class="modalback" id="modalBack"><section class="modal">${content}</section></div>`;$('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});}
function closeModal(){$('modalRoot').innerHTML='';}
function openLogin(){if(state.user){state.user=null;refreshControls();render();showMessage('Đã đăng xuất.','ok');return;} openModal(`<h2>Đăng nhập</h2><form id="loginForm"><div class="formgrid"><div class="field full"><label>Tên đăng nhập</label><input id="loginUser" autocomplete="username" required></div><div class="field full"><label>Mật khẩu</label><input id="loginPass" type="password" autocomplete="current-password" required></div></div><p class="hint">Tài khoản được cấu hình cố định trong index.html.</p><div class="modalfoot"><button type="button" id="cancelLogin">Hủy</button><div class="right"><button class="primary" type="submit">Đăng nhập</button></div></div></form>`); $('cancelLogin').onclick=closeModal; $('loginForm').onsubmit=e=>{e.preventDefault();const u=FIXED_USERS.find(x=>x.username===$('loginUser').value.trim()&&x.password===$('loginPass').value);if(!u){alert('Sai tên đăng nhập hoặc mật khẩu.');return;}state.user=u;closeModal();refreshControls();render();showMessage(`Đã đăng nhập với tài khoản ${u.username}.`,'ok');}; }
function openTokenModal(){if(!canEdit())return;openModal(`<h2>Token GitHub</h2><p class="hint">Token chỉ được giữ trong sessionStorage của tab hiện tại, không nằm trong file mã nguồn. Hãy dùng Fine-grained Personal Access Token chỉ có quyền Contents: Read and write cho đúng repository.</p><div class="field"><label>GitHub token</label><input id="ghToken" type="password" autocomplete="off" value="${escapeHtml(state.token)}" placeholder="github_pat_…"></div><div class="modalfoot"><button id="clearToken" class="danger">Xóa token</button><div class="right"><button id="cancelToken">Hủy</button><button id="saveToken" class="primary">Lưu trong phiên</button></div></div>`);$('cancelToken').onclick=closeModal;$('saveToken').onclick=()=>{state.token=$('ghToken').value.trim();if(state.token)sessionStorage.setItem('timetable_github_token',state.token);else sessionStorage.removeItem('timetable_github_token');closeModal();showMessage(state.token?'Token đã lưu trong phiên trình duyệt.':'Đã xóa token.');};$('clearToken').onclick=()=>{state.token='';sessionStorage.removeItem('timetable_github_token');closeModal();showMessage('Đã xóa token khỏi phiên trình duyệt.','ok');};}
function openEventForm(id=null){if(!canEdit())return;const old=id?state.data.events.find(e=>e.id===id):null;const e=old||{id:'ev_'+crypto.randomUUID(),studentId:state.data.students[0]?.id||'',title:'',date:dateKey(state.viewDate),start:'07:00',end:'07:45',location:'',notes:'',color:'#dceafe'};openModal(`<h2>${old?'Sửa lịch':'Thêm lịch học'}</h2><form id="eventForm"><div class="formgrid"><div class="field full"><label>Học sinh</label><select id="evStudent" required>${state.data.students.map(s=>`<option value="${escapeHtml(s.id)}" ${s.id===e.studentId?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}</select></div><div class="field full"><label>Môn học / hoạt động</label><input id="evTitle" required maxlength="100" value="${escapeHtml(e.title)}"></div><div class="field"><label>Ngày</label><input id="evDate" type="date" required value="${escapeHtml(e.date)}"></div><div class="field"><label>Địa điểm</label><input id="evLocation" maxlength="100" value="${escapeHtml(e.location||'')}"></div><div class="field"><label>Giờ bắt đầu</label><input id="evStart" type="time" required value="${escapeHtml(e.start)}"></div><div class="field"><label>Giờ kết thúc</label><input id="evEnd" type="time" required value="${escapeHtml(e.end)}"></div><div class="field"><label>Màu</label><input id="evColor" type="color" value="${escapeHtml(e.color||'#dceafe')}"></div><div class="field full"><label>Ghi chú</label><textarea id="evNotes" maxlength="500">${escapeHtml(e.notes||'')}</textarea></div></div><div class="modalfoot"><button type="button" id="cancelEvent">Hủy</button><div class="right"><button class="primary" type="submit">Lưu thay đổi</button></div></div></form>`);$('cancelEvent').onclick=closeModal;$('eventForm').onsubmit=ev=>{ev.preventDefault();const start=$('evStart').value,end=$('evEnd').value;if(start>=end){alert('Giờ kết thúc phải sau giờ bắt đầu.');return;}const next={...e,studentId:$('evStudent').value,title:$('evTitle').value.trim(),date:$('evDate').value,start,end,location:$('evLocation').value.trim(),notes:$('evNotes').value.trim(),color:$('evColor').value};if(!next.title)return;if(old)state.data.events=state.data.events.map(x=>x.id===id?next:x);else state.data.events.push(next);state.dirty=true;closeModal();render();showMessage('Đã thay đổi trên thiết bị này. Bấm “Lưu & đồng bộ lên GitHub” để lưu chung.','err');};}
function deleteEvent(id){if(!canEdit())return;const e=state.data.events.find(x=>x.id===id);if(!e||!confirm(`Xóa lịch “${e.title}” ngày ${e.date}?`))return;state.data.events=state.data.events.filter(x=>x.id!==id);state.dirty=true;render();showMessage('Đã xóa ở bản nháp cục bộ. Bấm “Lưu & đồng bộ lên GitHub” để lưu chung.','err');}
function utf8ToBase64(str){const bytes=new TextEncoder().encode(str);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(bin);}
function base64ToUtf8(str){const bin=atob(str.replace(/\n/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes);}
function apiHeaders(){return {'Accept':'application/vnd.github+json','Authorization':`Bearer ${state.token}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};}
async function saveToGitHub(){if(!canEdit()||state.saving)return;if(!configReady()){showMessage('Hãy sửa owner và repo trong phần GITHUB ở index.html trước.','err');return;}if(!state.token){openTokenModal();showMessage('Cần token GitHub để ghi dữ liệu.','err');return;}if(!state.dirty){showMessage('Không có thay đổi cần lưu.','ok');return;}state.saving=true;$('saveBtn').disabled=true;setStatus('Đang lưu…');try{
 const api=`https://api.github.com/repos/${encodeURIComponent(GITHUB.owner)}/${encodeURIComponent(GITHUB.repo)}/contents/${GITHUB.path.split('/').map(encodeURIComponent).join('/')}`;
 const get=await fetch(api,{headers:apiHeaders(),cache:'no-store'});if(!get.ok)throw new Error(`Không đọc được file qua GitHub API (HTTP ${get.status}). Kiểm tra token, repository và quyền Contents.`);
 const remote=await get.json();const remoteData=normalizeData(JSON.parse(base64ToUtf8(remote.content)));
 if(Number(remoteData.revision)!==Number(state.baseRevision)){throw new Error(`Phát hiện xung đột: dữ liệu GitHub đã lên phiên bản ${remoteData.revision}, còn bản bạn đang sửa là ${state.baseRevision}. Hãy bấm Đồng bộ, kiểm tra lại rồi áp dụng thay đổi lần nữa.`);}
 const next={...state.data,revision:Number(remoteData.revision||0)+1,updatedAt:new Date().toISOString(),updatedBy:state.user.username};
 const put=await fetch(api,{method:'PUT',headers:apiHeaders(),body:JSON.stringify({message:`Update timetable (${state.user.username})`,content:utf8ToBase64(JSON.stringify(next,null,2)+'\n'),sha:remote.sha,branch:GITHUB.branch})});
 if(!put.ok){const err=await put.json().catch(()=>({}));throw new Error(`GitHub từ chối lưu (HTTP ${put.status}): ${err.message||'hãy kiểm tra token/quyền và thử lại'}`);}
 state.data=next;state.baseRevision=next.revision;state.dirty=false;render();setStatus('Đã lưu lên GitHub','ok');showMessage(`Đã lưu thành công phiên bản ${next.revision}. GitHub Pages có thể cần vài phút để xuất bản JSON mới; thiết bị khác sẽ thấy dữ liệu sau khi bản Pages cập nhật.`,'ok');
 }catch(err){setStatus('Chưa lưu được','err');showMessage(err.message,'err');}finally{state.saving=false;$('saveBtn').disabled=false;}}
async function manualSync(){if(state.dirty&&!confirm('Bạn có thay đổi chưa lưu. Tải dữ liệu từ GitHub sẽ làm mất các thay đổi này. Tiếp tục?'))return;state.dirty=false;await loadPublished();}
$('loginBtn').onclick=openLogin;$('syncBtn').onclick=manualSync;$('addBtn').onclick=()=>openEventForm();$('saveBtn').onclick=saveToGitHub;$('tokenBtn').onclick=openTokenModal;$('studentFilter').onchange=render;$('viewMode').onchange=()=>{state.view=$('viewMode').value;render();};$('prevBtn').onclick=()=>{if(state.view==='day')state.viewDate.setDate(state.viewDate.getDate()-1);else state.viewDate.setDate(state.viewDate.getDate()-7);render();};$('nextBtn').onclick=()=>{if(state.view==='day')state.viewDate.setDate(state.viewDate.getDate()+1);else state.viewDate.setDate(state.viewDate.getDate()+7);render();};$('todayBtn').onclick=()=>{state.viewDate=new Date();render();};$('autoSync').onchange=()=>showMessage($('autoSync').checked?'Tự động kiểm tra dữ liệu mỗi 60 giây đã bật.':'Đã tắt đồng bộ tự động.');
loadPublished();setInterval(()=>{if($('autoSync').checked&&!state.dirty&&!state.saving)loadPublished({quiet:true});},POLL_MS);
</script></body></html>
